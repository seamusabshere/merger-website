title: "Act 170 merger planning: technical assistance, resources, and recommended approach"
publisher: Vermont Agency of Education
createdByTheCommittee: false
publishedOn: "2026-10-23"
updatedOn: "2026-10-27"
summary: |
  A memo from Secretary of Education Zoie Saunders to the facilitators. It gives the Agency's view on how merger committees should work, which data they can use now, and what help is coming.

  It suggests committees work through three questions in order: what every district must provide, what our communities could do together, and how best to organize to do it. It lists public data on enrollment, staff, spending, and buildings.

  It says the Agency and State Board of Education plan to publish the standards they will use to review merger proposals in December 2026, and planning tools for money and staffing in February or March 2027.

  The memo states the Agency's position that the current system is "inequitable for students and unsustainable for taxpayers." It is one view. The committee has not adopted it.
