summary: |
  Act 170 is the state law that set up this study. It began as House bill H.955, "An act relating to next steps in transforming Vermont's education system." The Governor signed it on June 18, 2026.

  The law is 152 pages long and covers more than mergers. Section 13 creates the merger committees and says what they must study and report. Section 14 suggests which districts should study together. Group 18 is the Burlington, South Burlington, and Winooski school districts.

  Our page on Act 170 explains the parts that matter for this committee in plain language.
