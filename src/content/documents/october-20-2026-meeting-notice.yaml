summary: |
  The notice for the committee's first meeting, on October 20, 2026, from 4:00 to 5:30 p.m. at 60 Normand Street in Winooski, with a Google Meet link and a phone number.

  It sets out the agenda and the rules for public input. Each speaker has 2 minutes and gives their name and town first. Comments must be about items on the agenda. People who cannot attend may send a written comment to be read aloud.

  It also says the facilitator runs the meeting, that meetings should last no more than 2 hours, and that superintendents and board members who are not on the committee take part as members of the public.

  The Winooski City Council's October 14 packet linked to this notice, so it was public by that date. This site posted the PDF on October 27, 2026.
