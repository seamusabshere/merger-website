title: Finalized merger committee groupings
publisher: Vermont Learning Collaborative
publishedOn: "2026-09-25"
updatedOn: "2026-10-27"
summary: |
  The press release that set the final list of 18 merger committees across Vermont, after a week in which school boards could ask for changes. Burlington, South Burlington, and Winooski stayed together as Group 18 in the Chittenden Central region.

  It gives each district's average daily membership for fiscal year 2025, a count of the students the district pays to educate: Burlington 3,385, South Burlington 2,512, and Winooski 785, for 6,682 in all.

  It also includes the Good Faith Participation Standard and the standard agenda for every committee's first meeting.
