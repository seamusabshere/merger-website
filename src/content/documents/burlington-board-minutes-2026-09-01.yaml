summary: |
  The Burlington School Board voted unanimously to appoint five board members to the merger committee for 2026 and 2027: Lucia Campriello, Gary Golden, Kendra Sowers, Jean Waltz, and Clare Wool, the board chair.

  The motion says five is the most Burlington may send, chosen "to safeguard our voice based on the size of our district." The board may cut its delegation to three later.

  These minutes are a draft. The board had not yet approved them when we added this record.
