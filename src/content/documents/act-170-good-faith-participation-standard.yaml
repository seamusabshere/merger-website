title: Act 170 Good Faith Participation Standard
publisher: Vermont Learning Collaborative, Act 170 Facilitation Team
publishedOn: "2026-09-25"
updatedOn: "2026-10-27"
summary: |
  Act 170 says each school district must take part in its merger committee "in good faith," but does not define the term. This working standard from the state's facilitation team says what it means.

  A district takes part in good faith when it shows up, shares the information the committee needs, and does not stop the committee from doing its study. Good faith does not mean supporting a merger. Districts and members may question the data, argue for their community, criticize the law, oppose a merger, and vote no.

  A finding of bad faith needs a documented pattern of conduct that stops the committee's work. A district gets written notice and a chance to fix the problem first. The lead facilitator reports any bad faith findings to the Legislature by December 1, 2028.
