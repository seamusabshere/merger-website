summary: |
  An update to the Winooski City Council from Deputy Mayor Bryn Oakleaf. It gives background on Act 170 and the study timeline, and names Winooski School Board Chair Nicole Mace as Winooski's member of this committee.

  It describes Winooski's "Merger Study Buddies," a group of residents who advise the Winooski School Board. Act 170 does not require this group. They meet during regular Winooski School Board meetings, on the second Wednesday of each month at 6:00 p.m.

  It names four questions to weigh: educational opportunity, governance, money and operations, and long-term sustainability. These are Winooski's summary of the law, not words from the law itself.
