name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Legal posting deadlines
        run: npm run check:deadlines
