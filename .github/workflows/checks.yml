name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Legal posting deadlines
        run: pnpm check:deadlines
